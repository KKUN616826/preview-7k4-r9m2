name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage website without video production sources
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='/_site/' --exclude='/.git/' --exclude='/.github/' --exclude='/intro_video_hyperframes/' --exclude='node_modules/' ./ _site/
          mkdir -p _site/intro_video_hyperframes/renders
          cp intro_video_hyperframes/renders/mind2act-world-promo-20261025.mp4 _site/intro_video_hyperframes/renders/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          total = sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file())
          print(f'Published site bytes: {total:,}')
          assert total < 950_000_000, 'Website exceeds publishing size guard'
          assert Path('_site/index.html').is_file()
          assert Path('_site/CNAME').read_text().strip() == 'mind2act-world.com'
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
